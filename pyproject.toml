[project]
name = "cctv-traffic-volume-forecasting"
version = "0.1.0"
description = "CCTV 영상으로 교통량을 세고, 기상 · 달력 정보로 교통량을 예측"
requires-python = ">=3.10,<3.13"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "opencv-python-headless>=4.9",
    "pyyaml>=6.0",
    "requests>=2.31",
    "holidays>=0.50",
    "scikit-learn>=1.4",
    "xgboost>=2.0",
    "lightgbm>=4.3",
    "shap>=0.45",
    "matplotlib>=3.8",
    "tabulate>=0.9",
    "joblib>=1.3",
    "torch>=2.7",
    "torchvision>=0.22",
    "ultralytics>=8.3",
]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.5"]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
